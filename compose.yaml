services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
  app:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
